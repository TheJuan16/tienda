<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Producto</title>
    <style>
        /* Estilos del contenedor del formulario */
        .form-contenedor {
            max-width: 400px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            font-family: Arial, sans-serif;
        }

        .form-contenedor h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        /* Estilos para los grupos de campos */
        .form-grupo {
            margin-bottom: 15px;
        }

        .form-grupo label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        /* Estilos para los inputs, select y textarea */
        .form-grupo input,
        .form-grupo select,
        .form-grupo textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Evita que el padding altere el ancho */
            font-size: 14px;
        }

        /* Cambiar el borde al hacer clic en un campo */
        .form-grupo input:focus,
        .form-grupo select:focus,
        .form-grupo textarea:focus {
            border-color: #28a745;
            outline: none;
        }

        /* Estilo del botón de enviar */
        .btn-guardar {
            width: 100%;
            background-color: #28a745; /* Verde */
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        .btn-guardar:hover {
            background-color: #218838; /* Verde más oscuro */
        }
    </style>
</head>
<body>

    <div class="form-contenedor">
        <h2>Nuevo Producto</h2>

        <!-- Formulario -->
        <form action="#" method="POST">

            <!-- Nombre del Producto -->
            <div class="form-grupo">
                <label for="nombre">Nombre del Producto:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Camiseta Algodón" required>
            </div>

            <!-- Precio -->
            <div class="form-grupo">
                <label for="precio">Precio ($):</label>
                <input type="number" id="precio" name="precio" step="0.01" placeholder="0.00" required>
            </div>

            <!-- Categoría -->
            <div class="form-grupo">
                <label for="categoria">Categoría:</label>
                <select id="categoria" name="categoria" required>
                    <option value="" disabled selected>Selecciona una opción</option>
                    <option value="ropa">Ropa / Moda</option>
                    <option value="electronica">Electrónica</option>
                    <option value="hogar">Hogar</option>
                    <option value="otros">Otros</option>
                </select>
            </div>

            <!-- Descripción -->
            <div class="form-grupo">
                <label for="descripcion">Descripción:</label>
                <textarea id="descripcion" name="descripcion" rows="3" placeholder="Breve descripción del producto..."></textarea>
            </div>

            <!-- Botón de Envío -->
            <button type="submit" class="btn-guardar">Guardar Producto</button>

        </form>
    </div>

</body>
</html>
